<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARIS Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="layout">
    <aside class="sidebar">
      <h2>Units</h2>
      <div id="units"></div>
    </aside>

    <main class="main">
      <section class="topbar">
        <div class="card">
          <small>Total Units</small>
          <div id="totalUnits">0</div>
        </div>

        <div class="card">
          <small>Online</small>
          <div id="onlineUnits">0</div>
        </div>

        <div class="card">
          <small>Avg Latency</small>
          <div id="avgLatency">0 ms</div>
        </div>

        <div class="card">
          <small>Total Events</small>
          <div id="totalCommands">0</div>
        </div>
      </section>

      <section class="content">
        <section class="feed">
          <div class="camera-panel">
            <div class="feed-header">
              <h2>Live Camera Stream</h2>
              <span id="cameraStatus" class="status-badge status-offline">offline</span>
            </div>

            <img
              id="cameraStream"
              class="camera-stream"
              src="http://127.0.0.1:8000/api/v1/camera/stream"
              alt="Live local camera stream"
            />
          </div>

          <div class="feed-header">
            <h2>Live Model Output Feed</h2>

            <div class="filter-group">
              <button id="filterAll" class="filter-btn active">All Outputs</button>
              <button id="filterHigh" class="filter-btn">High Priority</button>
            </div>
          </div>

          <div id="commands"></div>
        </section>

        <aside class="detail">
          <h2>Unit Details</h2>
          <div id="details"></div>

          <h2 class="history-title">Other Units Live Model Output Feed</h2>
          <div id="history"></div>
        </aside>
      </section>
    </main>
  </div>

  <script src="app.js?v=5"></script>
</body>
</html>
